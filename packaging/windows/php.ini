; PHP embarcado do SnakeCode. Usado apenas pelo snakecode.cmd; não afeta outros PHPs da máquina.
; extension_dir é passado pelo lançador (caminho absoluto da pasta ext).

{{EXTENSIONS}}

; FFI é usado só para falar com o console do Windows (kernel32.dll).
ffi.enable = true

memory_limit = 256M
display_errors = stderr
error_reporting = E_ALL & ~E_DEPRECATED
date.timezone = UTC
